<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API de los simpsons</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <header>
        <h1>Api de los simpsons</h1>
        <p>Explora los personajes y frases célebres de la serie</p>
    </header>

    <section class="controls">
        <button id="load-btn">Cargar Personajes</button>
    </section>

    <section id="loading" class="hidden">
        <div class="spinner"></div>
        <p>Cargando personajes...</p>
    </section>

    <div id="error-message" class="hidden"></div>

    <section id="characters-container"></section>

    <footer>
        <p>Documentación de la API: <a href="https://thesimpsonsapi.com/" target="_blank">The Simpsons API</a></p>
    </footer>

    <!-- Importante: Apuntar al archivo compilado en dist -->
    <script type="module" src="./dist/main.js"></script>
</body>
</html>
